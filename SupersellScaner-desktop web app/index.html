<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanPulse Dashboard Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { background: radial-gradient(circle at top right, #111827, #030712); }
    </style>
</head>
<body class="text-gray-100 min-h-screen font-sans antialiased">

    <div id="authScreen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-gray-900/60 backdrop-blur-md p-8 rounded-2xl border border-gray-800 max-w-sm w-full shadow-2xl">
            <h2 id="authTitle" class="text-2xl font-black text-white tracking-tight mb-1 text-center">⚡ ScanPulse Portal</h2>
            <p id="authSubtitle" class="text-xs text-gray-400 mb-6 text-center">Sign in to view your inventory</p>
            
            <div class="space-y-3 mb-4">
                <div>
                    <label class="text-xs text-gray-400 font-semibold block mb-1">Email Address</label>
                    <input type="email" id="emailInput" placeholder="name@company.com" class="w-full px-4 py-2.5 bg-gray-950 border border-gray-800 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-white">
                </div>
                <div>
                    <label class="text-xs text-gray-400 font-semibold block mb-1">Password</label>
                    <input type="password" id="passwordInput" placeholder="••••••••" class="w-full px-4 py-2.5 bg-gray-950 border border-gray-800 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-white">
                </div>
                
                <div class="pt-2">
                    <button id="submitAuthBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm py-2.5 px-4 rounded-xl cursor-pointer transition">
                        Sign In
                    </button>
                </div>
            </div>

            <p class="text-center text-xs text-gray-400">
                <span id="toggleText">Don't have an account?</span> 
                <button id="toggleAuthModeBtn" class="text-blue-400 font-bold hover:underline cursor-pointer ml-1">Make one!!!!</button>
            </p>
        </div>
    </div>

    <div id="dashboardScreen" class="max-w-6xl mx-auto p-4 md:p-8 hidden">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-10 gap-6 border-b border-gray-800 pb-6">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-white to-gray-500 bg-clip-text text-transparent">⚡ ScanPulse HQ</h1>
                <p class="text-sm text-gray-400 mt-1.5 flex items-center gap-2" id="userWelcome">Session: Synchronizing...</p>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <button id="exportBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm py-2.5 px-5 rounded-xl cursor-pointer transition">
                    📊 Export Ledger
                </button>
                <button id="logoutBtn" class="bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold text-sm py-2.5 px-4 rounded-xl cursor-pointer transition border border-gray-700">
                    Sign Out
                </button>
            </div>
        </div>

        <div class="bg-gray-900/50 backdrop-blur-md rounded-2xl border border-gray-800 shadow-2xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-950/40 border-b border-gray-800 text-xs font-bold text-gray-400 uppercase tracking-widest">
                        <th class="py-4 px-6">Product Identifier</th>
                        <th class="py-4 px-6">Asset Barcode</th>
                        <th class="py-4 px-6">Valuation</th>
                        <th class="py-4 px-6">Availability</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody" class="divide-y divide-gray-800/40 text-sm">
                    <tr><td colspan="4" class="p-16 text-center text-gray-500 font-medium">Syncing live data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rrevdrqnyveofsyvrtty.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_I9ufFAro4p2TknfrqrieOQ_o2j-d6Ge';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true, autoRefreshToken: true }
        });

        let isSignUpMode = false;
        let currentInventory = [];

        const toggleAuthModeBtn = document.getElementById('toggleAuthModeBtn');
        const submitAuthBtn = document.getElementById('submitAuthBtn');
        const toggleText = document.getElementById('toggleText');
        const authSubtitle = document.getElementById('authSubtitle');

        toggleAuthModeBtn.addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;
            if (isSignUpMode) {
                authSubtitle.innerText = "Create a new profile to get started";
                submitAuthBtn.innerText = "Create Account";
                toggleText.innerText = "Already have an account?";
                toggleAuthModeBtn.innerText = "Log in instead";
            } else {
                authSubtitle.innerText = "Sign in to view your inventory";
                submitAuthBtn.innerText = "Sign In";
                toggleText.innerText = "Don't have an account?";
                toggleAuthModeBtn.innerText = "Make one!!!!";
            }
        });

        submitAuthBtn.addEventListener('click', async () => {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            
            if (isSignUpMode) {
                const { error } = await supabaseClient.auth.signUp({ email, password });
                if (error) alert("Sign up error: " + error.message);
                else alert("Account registration complete! Logging you in...");
            } else {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) alert("Login error: " + error.message);
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.reload();
        });

        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session) {
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('dashboardScreen').classList.remove('hidden');
                document.getElementById('userWelcome').innerText = `Logged in as: ${session.user.email}`;
                fetchInventory();
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('dashboardScreen').classList.add('hidden');
            }
        });

        async function fetchInventory() {
            const { data } = await supabaseClient.from('inventory').select('*').order('scanned_at', { ascending: false });
            if (data) { currentInventory = data; renderTable(); }
        }

        function renderTable() {
            const tbody = document.getElementById('inventoryTableBody');
            tbody.innerHTML = currentInventory.map(item => `
                <tr class="hover:bg-gray-800/30">
                    <td class="py-4 px-6 font-semibold text-white">${item.item_name || 'Generic Asset'}</td>
                    <td class="py-4 px-6"><code class="bg-gray-950 text-gray-300 font-mono text-xs px-2.5 py-1 rounded-md border border-gray-800">${item.barcode}</code></td>
                    <td class="py-4 px-6 text-emerald-400 font-semibold">$${parseFloat(item.price).toFixed(2)}</td>
                    <td class="py-4 px-6"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-blue-500/10 text-blue-400 border border-blue-500/20">${item.quantity} units</span></td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
